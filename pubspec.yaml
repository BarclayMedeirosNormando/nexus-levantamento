name: nexus_levantamento
description: App offline-first de levantamento de inventário escolar — SEECT-PB.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Persistência local (offline-first)
  sqflite: ^2.3.3
  # sqflite "puro" só tem implementação nativa em Android/iOS — no
  # Windows/Linux/macOS (desktop) precisa dessa camada FFI por baixo,
  # inicializada em main.dart antes de qualquer abertura de banco.
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Rede
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Identificadores
  uuid: ^4.4.0

  # Captura em campo
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.13.0
  flutter_image_compress: ^2.3.0
  geolocator: ^12.0.0
  signature: ^5.5.0

  # Segurança / sessão
  flutter_secure_storage: ^9.2.2

  # Sync em background — 2026-09-12: bumped de ^0.5.2 pra ^0.10.10. A 0.5.2
  # ainda usava classes do "shim" de compatibilidade com o embedding V1 do
  # Flutter (PluginRegistry.Registrar/ShimPluginRegistry/
  # PluginRegistrantCallback) que já não existem mais no engine atual —
  # build falhava com "Unresolved reference" em cima dessas classes.
  # Removido no changelog do próprio pacote a partir da 0.6.0 ("Removed V1
  # plugin APIs — this is now an Android V2 plugin only"). A API usada em
  # `lib/data/background_sync.dart` (`initialize`, `registerPeriodicTask`,
  # `executeTask`, `Constraints`/`NetworkType.connected`) não mudou entre
  # 0.5.2 e 0.10.10 — só a versão pinada precisava subir.
  workmanager: ^0.10.10

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
