name: nexus_levantamento
description: App offline-first de levantamento de inventário escolar — SEECT-PB.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Persistência local (offline-first)
  sqflite: ^2.3.3
  # sqflite "puro" só tem implementação nativa em Android/iOS — no
  # Windows/Linux/macOS (desktop) precisa dessa camada FFI por baixo,
  # inicializada em main.dart antes de qualquer abertura de banco.
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Rede
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Identificadores
  uuid: ^4.4.0

  # Captura em campo
  image_picker: ^1.1.2
  # 2026-09-14: preso em 5.1.1 dava "Nao foi possivel abrir a camera"
  # (genericError, NullPointerException nativa) em release, reproduzido em
  # Xiaomi e Samsung reais - bem parecido com o bug de paginas de memoria
  # de 16KB corrigido no CameraX empacotado a partir da 6.0.11 do plugin
  # (changelog: "Update camerax dependencies to support 16KB pages sizes").
  # Sem breaking change de API entre 5.1.1 e 6.0.11 (o churn do errorBuilder
  # foi so na 5.0.0-beta, revertido antes da 5.1.0).
  mobile_scanner: ^6.0.11
  flutter_image_compress: ^2.3.0
  geolocator: ^12.0.0
  signature: ^5.5.0

  # Segurança / sessão
  flutter_secure_storage: ^9.2.2
  # 2026-09-14: hash local da senha (ver auth_service.dart/
  # conferirSenhaLocal) — confirmar ações destrutivas (ex.: remover
  # ambiente) sem depender de internet no momento da confirmação. Nunca
  # transmitido, nunca usado pra autenticar no servidor — só compara
  # localmente contra o hash salvo no último login/troca de senha.
  crypto: ^3.0.3

  # Sync em background — 2026-09-12: bumped de ^0.5.2 pra ^0.10.10. A 0.5.2
  # ainda usava classes do "shim" de compatibilidade com o embedding V1 do
  # Flutter (PluginRegistry.Registrar/ShimPluginRegistry/
  # PluginRegistrantCallback) que já não existem mais no engine atual —
  # build falhava com "Unresolved reference" em cima dessas classes.
  # Removido no changelog do próprio pacote a partir da 0.6.0 ("Removed V1
  # plugin APIs — this is now an Android V2 plugin only"). A API usada em
  # `lib/data/background_sync.dart` (`initialize`, `registerPeriodicTask`,
  # `executeTask`, `Constraints`/`NetworkType.connected`) não mudou entre
  # 0.5.2 e 0.10.10 — só a versão pinada precisava subir.
  workmanager: ^0.10.10

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Geram ícone/splash a partir de assets/icon/*.png — rodar depois de
  # `flutter pub get`: `dart run flutter_launcher_icons` e
  # `dart run flutter_native_splash:create`. Só mexem em arquivos nativos
  # (android/ios), não entram no app compilado — zero custo em runtime.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#262B65"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#262B65"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#262B65"
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#262B65"
